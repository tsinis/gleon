# The toolchain (a pinned nightly) is defined once in `rust-toolchain.toml`
# and is shared by developer checks, CI and release builds.

[config]
default_to_workspace = false

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all-features"]

[tasks.deny]
command = "cargo"
args = ["deny", "check"]

[tasks.audit]
# `cargo deny check` already covers advisories; we run audit as a second source of truth.
# We drop the explicit --ignore list here to keep deny.toml as the single source of truth for ignores.
command = "cargo"
args = [
    "audit"
]

[tasks.miri]
env = { MIRIFLAGS = "-Zmiri-disable-isolation" }
command = "cargo"
args = ["miri", "test"]

[tasks.semver]
ignore_errors = true
command = "cargo"
args = ["semver-checks", "check-release", "--baseline-root", "."]

[tasks.udeps]
command = "cargo"
args = ["udeps", "--all-targets"]

[tasks.mutants]
ignore_errors = true
command = "cargo"
args = ["mutants"]

[tasks.hack]
command = "cargo"
args = ["hack", "test", "--feature-powerset"]

[tasks.llvm-lines]
command = "cargo"
args = ["llvm-lines", "--package", "gleon", "--release"]

[tasks.expand]
command = "cargo"
args = ["expand"]

[tasks.trust]
script = '''
if cargo trust --version > /dev/null 2>&1; then
    cargo trust
else
    echo "cargo-trust not available on this platform, skipping"
fi
'''

[tasks.llvm-cov]
command = "cargo"
args = ["llvm-cov", "nextest", "--all-features", "--workspace", "--lcov", "--output-path", "lcov.info", "--fail-under-lines", "20"]

[tasks.call-stack]
command = "cargo"
args = ["call-stack"]

[tasks.bloat]
ignore_errors = true
command = "cargo"
args = ["bloat", "--release", "--crates"]

[tasks.check-all]
dependencies = [
    "fmt",
    "clippy",
    "test",
    "deny",
    "audit",
    "semver",
    "udeps",
    "llvm-lines",
    "trust",
    "miri",
    "bloat",
    "llvm-cov"
]
