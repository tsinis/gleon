name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: gleon
            asset_name: gleon-linux-x86_64
          # TODO: Add macOS (x86_64, aarch64) and Windows (x86_64) targets when needed.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cd dist
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update Action Reference to Exact Tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Updating action reference in workflows to exact tag ${TAG_NAME}..."

          # Update action ref in approve.yml, cleanup.yml, and README.md to exact immutable release tag
          sed -i -E "s|uses: tsinis/gleon@[a-zA-Z0-9_./-]+|uses: tsinis/gleon@${TAG_NAME}|g" .github/workflows/approve.yml
          sed -i -E "s|uses: tsinis/gleon@[a-zA-Z0-9_./-]+|uses: tsinis/gleon@${TAG_NAME}|g" .github/README.md
          sed -i -E "s|uses: tsinis/gleon/\.github/workflows/([a-zA-Z0-9_-]+)\.yml@[a-zA-Z0-9_./-]+|uses: tsinis/gleon/.github/workflows/\1.yml@${TAG_NAME}|g" .github/README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/approve.yml .github/README.md

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update action ref to ${TAG_NAME}"
            git push origin HEAD:main
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/

      - name: Create Checksums File
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
