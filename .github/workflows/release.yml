name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Required for actions/attest-build-provenance
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: gleon
            asset_name: gleon-linux-x86_64
          # TODO: Add macOS (x86_64, aarch64) and Windows (x86_64) targets when needed.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cd dist
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Action Reference to Exact Tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Updating action reference in workflows to exact tag ${TAG_NAME}..."

          # Update action ref in approve.yml to exact immutable release tag
          sed -i -E "s|uses: tsinis/gleon@[a-zA-Z0-9_./-]+|uses: tsinis/gleon@${TAG_NAME}|g" .github/workflows/approve.yml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/approve.yml

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update action ref to ${TAG_NAME}"
            git push origin HEAD:main
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/

      - name: Create Checksums File
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
