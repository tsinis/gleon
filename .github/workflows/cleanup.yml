name: Gleon Cleanup

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number (defaults to github.event.pull_request.number)"
        type: string
        required: false
        default: ""
      repository:
        description: "Target repository (defaults to github.repository)"
        type: string
        required: false
        default: ""
    secrets:
      token:
        description: "GitHub token (defaults to github.token)"
        required: false

permissions: {}

jobs:
  cleanup-ephemeral-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete PR diffs branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const prNumberInput = process.env.INPUT_PR_NUMBER;
            const prNumber = prNumberInput || context.payload.pull_request?.number || context.issue?.number;
            
            if (!prNumber) {
              core.setFailed("Could not determine PR number for cleanup.");
              return;
            }

            if (!/^\d+$/.test(prNumber)) {
              core.setFailed(`Invalid PR number format: ${prNumber}`);
              return;
            }

            const targetRepoInput = process.env.INPUT_REPOSITORY;
            let owner = context.repo.owner;
            let repo = context.repo.repo;

            if (targetRepoInput) {
              const parts = targetRepoInput.split('/');
              if (parts.length === 2) {
                owner = parts[0];
                repo = parts[1];
              } else {
                core.setFailed(`Invalid repository format: ${targetRepoInput}`);
                return;
              }
            }

            const ref = `heads/gleon/diffs/pr-${prNumber}`;
            try {
              await github.rest.git.deleteRef({
                owner: owner,
                repo: repo,
                ref: ref,
              });
              core.info(`Successfully deleted ephemeral branch: ${ref}`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`Branch reference ${ref} does not exist (404), skipping.`);
              } else if (e.status === 422) {
                core.info(`Reference does not exist or validation failed (422), skipping. Message: ${e.message}`);
              } else {
                core.setFailed(`Failed to delete branch ${ref}: ${e.message}`);
              }
            }
