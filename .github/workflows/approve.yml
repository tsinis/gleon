name: Gleon Approve

on:
  workflow_call:
    inputs:
      version:
        description: "gleon version tag to use (e.g. v0.1.0 or latest)"
        type: string
        default: "latest"
      checksum:
        description: "SHA256 checksum of the binary (optional)"
        type: string
        required: false
        default: ""
      working-directory:
        description: "Directory to run gleon from"
        type: string
        default: "."
      pat-token:
        description: "Personal Access Token to trigger subsequent CI runs on push (strongly recommended)"
        type: string
        required: false
        default: ""
    secrets:
      R2_ACCOUNT_ID:
        required: true
      GLEON_STORAGE_URL:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions: {}

jobs:
  approve:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/gleon approve')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify Collaborator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (permission.data.permission !== 'admin' && permission.data.permission !== 'write') {
              core.setFailed(`User ${context.actor} does not have write access.`);
            }

      - name: Get PR Info & Security Check
        id: pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Security: Reject PRs from forks to prevent untrusted code execution
            if (!pr.data.head.repo || pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
              core.setFailed("Refusing to approve PRs from forks due to security risks.");
            }

            core.setOutput("head_sha", pr.data.head.sha);
            core.setOutput("head_ref", pr.data.head.ref);

      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ inputs.pat-token || github.token }}
          # Security: Target the PR HEAD SHA specifically.
          ref: ${{ steps.pr-info.outputs.head_sha }}
          persist-credentials: false

      - name: Download Artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .gleon-downloads
          gh run download -p "gleon-artifacts-${{ github.event.issue.number }}-*" -D .gleon-downloads/

      - name: Reconstruct Runs Directory
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          mkdir -p "$WORKING_DIRECTORY/.gleon/runs/latest"
          if [ -d .gleon-downloads ] && [ "$(ls -A .gleon-downloads 2>/dev/null)" ]; then
            find .gleon-downloads -mindepth 1 -maxdepth 1 -type d -exec cp -r {}/. "$WORKING_DIRECTORY/.gleon/runs/latest/" \;
            find .gleon-downloads -mindepth 1 -maxdepth 1 -type f -exec cp {} "$WORKING_DIRECTORY/.gleon/runs/latest/" \;
          else
            echo "::error::No verification artifacts found in .gleon-downloads for PR #${{ github.event.issue.number }}."
            exit 1
          fi

      - name: Run Gleon Approve
        uses: tsinis/gleon@main
        with:
          version: ${{ inputs.version }}
          checksum: ${{ inputs.checksum }}
          command: "approve"
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Security: Pass untrusted comment body via env variable to prevent script injection
          COMMENT_BODY: ${{ github.event.comment.body }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GLEON_STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Commit and Push
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PUSH_TOKEN: ${{ inputs.pat-token || github.token }}
        run: |
          cd "$WORKING_DIRECTORY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gleon/manifests/

          if ! git diff --staged --quiet; then
            git commit -m "chore(gleon): update baseline images"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          else
            echo "No changes to commit."
          fi
