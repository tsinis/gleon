name: gleon Baseline Approval

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: gleon-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/gleon approve') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Validate User Permissions & Fetch PR Info
        id: pr-info
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const user = context.payload.comment.user.login;
            const repo = context.repo;
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: repo.owner,
              repo: repo.repo,
              username: user
            });
            if (!['admin', 'write'].includes(perm.data.permission)) {
              core.setFailed(`User ${user} is not authorized to approve baseline changes.`);
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: context.issue.number
            });
            if (pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
              core.setFailed(`PR from fork (${pr.data.head.repo.full_name}) is not supported for automatic approval. Base is ${pr.data.base.repo.full_name}.`);
              return;
            }
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);

            try {
              const ref = await github.rest.git.getRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: `heads/gleon/diffs/pr-${context.issue.number}`
              });
              core.setOutput('ephemeral_sha', ref.data.object.sha);
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('ephemeral_sha', '');
              } else {
                throw e;
              }
            }

      - name: Checkout Base Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Trusted gleon Binary
        run: cargo install --path gleon

      - name: Fetch PR Branch & Screenshots
        env:
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          EPHEMERAL_SHA: ${{ steps.pr-info.outputs.ephemeral_sha }}
        run: |
          set -eo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid HEAD_SHA format: $HEAD_SHA"
            exit 1
          fi
          git fetch origin "$HEAD_SHA"
          RESTORED_ANY=false
          if git ls-tree --name-only "$HEAD_SHA" .gleon/manifests | grep -q .; then
            git checkout "$HEAD_SHA" -- .gleon/manifests/
            echo "Restored .gleon/manifests/ from PR branch."
            RESTORED_ANY=true
          fi
          if git ls-tree --name-only "$HEAD_SHA" .gleon/blobs | grep -q .; then
            git checkout "$HEAD_SHA" -- .gleon/blobs/
            echo "Restored .gleon/blobs/ from PR branch."
            RESTORED_ANY=true
          fi
          if ! $RESTORED_ANY; then
            echo "No existing manifests or blobs found in $HEAD_SHA to restore."
          fi

          if [ -n "$EPHEMERAL_SHA" ]; then
            if [[ ! "$EPHEMERAL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid EPHEMERAL_SHA format: $EPHEMERAL_SHA"
              exit 1
            fi
            if git fetch origin "$EPHEMERAL_SHA"; then
              if git checkout "$EPHEMERAL_SHA" -- .gleon/runs/latest/actual/; then
                echo "Restored actual screenshots from ephemeral branch."
                echo "APPROVE_FROM=.gleon/runs/latest/actual" >> "$GITHUB_ENV"
              elif git checkout "$EPHEMERAL_SHA" -- .gleon/diffs/; then
                echo "Restored diff artifacts from ephemeral branch."
                echo "APPROVE_FROM=.gleon/diffs" >> "$GITHUB_ENV"
              else
                echo "::warning::No recognized screenshot artifacts found in ephemeral branch."
              fi
            fi
          fi

      - name: Update Baselines
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
        run: |
          set -eo pipefail
          if [[ ! "$HEAD_REF" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
            echo "::error::Invalid HEAD_REF: $HEAD_REF"
            exit 1
          fi
          RAW_ARGS="$COMMENT_BODY"
          if ! ARG_STRING="$(printf '%s' "$RAW_ARGS" | sed 's#^/gleon approve[[:space:]]*##' | xargs 2>/dev/null)"; then
            echo "::error::Malformed arguments causing xargs to fail."
            exit 1
          fi
          FILTER_ARGS=()
          if [ -n "$ARG_STRING" ]; then
            read -r -a TOKENS <<< "$ARG_STRING"
            for token in "${TOKENS[@]}"; do
              if [[ "$token" =~ ^[A-Za-z0-9._/:=-]+$ ]]; then
                FILTER_ARGS+=("$token")
              else
                echo "::error::Invalid argument token: $token"
                exit 1
              fi
            done
          fi
          GLEON_BIN="$HOME/.cargo/bin/gleon"
          if [ -z "$APPROVE_FROM" ] || [ ! -d "$APPROVE_FROM" ]; then
            echo "::error::No actual screenshots found for approval. Run tests first to generate actual screenshots."
            exit 1
          fi
          "$GLEON_BIN" approve --from="$APPROVE_FROM" "${FILTER_ARGS[@]}"

      - name: Commit & Push Baselines
        env:
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          export GIT_INDEX_FILE=.git/tmp_index
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$HEAD_SHA"
          git add .gleon/manifests/ 2>/dev/null || true
          git add -f .gleon/blobs/ 2>/dev/null || true
          NEW_TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          rm -f .git/tmp_index

          HEAD_TREE=$(git rev-parse "$HEAD_SHA^{tree}")
          if [ "$NEW_TREE" = "$HEAD_TREE" ]; then
            echo "No baseline changes to commit."
          else
            NEW_COMMIT=$(git commit-tree $NEW_TREE -p "$HEAD_SHA" -m "chore(gleon): update baseline images [skip ci]")
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=Authorization: Basic $AUTH" \
              push origin "$NEW_COMMIT:refs/heads/$HEAD_REF" || {
              echo "::error::Failed to push approved baselines to $HEAD_REF. Check write permissions."
              exit 1
            }
          fi
