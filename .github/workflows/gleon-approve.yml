name: Gleon Baseline Approval

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/gleon approve') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Validate User Permissions & Fetch PR Info
        id: pr-info
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const user = context.payload.comment.user.login;
            const repo = context.repo;
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: repo.owner,
              repo: repo.repo,
              username: user
            });
            if (!['admin', 'write'].includes(perm.data.permission)) {
              core.setFailed(`User ${user} is not authorized to approve baseline changes.`);
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Install Rust Toolchain & Build Trusted Gleon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .gleon-trusted-src
      - name: Install Trusted Gleon Binary
        run: |
          cargo install --path .gleon-trusted-src/gleon
          rm -rf .gleon-trusted-src

      - name: Checkout PR Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: Download Screenshots from Ephemeral Branch
        run: |
          EPHEMERAL_BRANCH="gleon/diffs/pr-${{ github.event.issue.number }}"
          if git fetch origin "$EPHEMERAL_BRANCH"; then
            git checkout "origin/$EPHEMERAL_BRANCH" -- .gleon/runs/latest/actual/ || git checkout "origin/$EPHEMERAL_BRANCH" -- .gleon/diffs/ || true
          fi

      - name: Update Baselines & Commit
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
        run: |
          set -eo pipefail
          if [[ ! "$HEAD_REF" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
            echo "::error::Invalid HEAD_REF: $HEAD_REF"
            exit 1
          fi
          RAW_ARGS="$COMMENT_BODY"
          if ! ARG_STRING="$(printf '%s' "$RAW_ARGS" | sed 's#^/gleon approve[[:space:]]*##' | xargs 2>/dev/null)"; then
            echo "::error::Malformed arguments causing xargs to fail."
            exit 1
          fi
          FILTER_ARGS=()
          if [ -n "$ARG_STRING" ]; then
            read -r -a TOKENS <<< "$ARG_STRING"
            for token in "${TOKENS[@]}"; do
              if [[ "$token" =~ ^[A-Za-z0-9._/:=-]+$ ]]; then
                FILTER_ARGS+=("$token")
              else
                echo "::error::Invalid argument token: $token"
                exit 1
              fi
            done
          fi
          GLEON_BIN="$HOME/.cargo/bin/gleon"
          if [ -d ".gleon/runs/latest/actual" ]; then
            "$GLEON_BIN" approve --from=.gleon/runs/latest/actual "${FILTER_ARGS[@]}"
          elif [ -d ".gleon/diffs" ]; then
            "$GLEON_BIN" approve --from=.gleon/diffs "${FILTER_ARGS[@]}"
          else
            "$GLEON_BIN" approve "${FILTER_ARGS[@]}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gleon/manifests/ .gleon/blobs/
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(gleon): update baseline images [skip ci]"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin "HEAD:refs/heads/$HEAD_REF" || {
              echo "::error::Failed to push approved baselines to $HEAD_REF. Check write permissions."
              exit 1
            }
          fi
