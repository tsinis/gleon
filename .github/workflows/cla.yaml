name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla-assistant:
    name: 📝 CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: 🖋️ CLA Assistant Check
        if: (github.event.issue.pull_request != null && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: ribtoks/cla-github-action@f22feedd1f3f46f23fab3bc100081d349f9108af # v2.6.2
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "tsinis,bot*"
          lock-pull-request-after-merge: false
          empty-commit-for-cla-sign: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
