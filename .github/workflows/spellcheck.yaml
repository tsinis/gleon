name: Spellcheck

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  spellcheck:
    name: 📝 Codebook Spellcheck
    runs-on: ubuntu-slim

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Install Codebook LSP
        run: |
          gh release download --repo blopker/codebook --pattern '*x86_64*linux*' --output codebook.tar.gz
          tar -xzf codebook.tar.gz
          sudo mv codebook-lsp /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🔍 Run Codebook Spellcheck
        run: codebook-lsp lint .
