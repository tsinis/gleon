name: Gleon Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-ephemeral-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete PR diffs branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="gleon/diffs/pr-${{ github.event.number }}"
          echo "Attempting to delete ephemeral branch: $BRANCH_NAME"
          # We use gh api to delete the reference. We ignore 404/422 responses for missing branches, but fail on other errors.
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME" 2> gh_err.log || {
            EXIT_CODE=$?
            if grep -qE '(404|422)' gh_err.log; then
              echo "Branch not found or already deleted (404/422), ignoring error."
              exit 0
            else
              cat gh_err.log
              exit $EXIT_CODE
            fi
          }
