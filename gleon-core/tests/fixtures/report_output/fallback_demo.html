<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gleon Visual Regression Report - Fallback Demo</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --border-color: #2e323a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .test-case {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .test-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            align-items: start;
        }

        .image-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-width: 0;
        }

        .image-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
            text-align: center;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            display: inline-block;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            overflow: hidden;
        }

        .img-static {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            background-color: var(--danger); /* Make it obvious it's the diff image */
            min-height: 200px;
        }
    </style>
    <script>
        // Register image loading error capture listener before rendering
        document.addEventListener('error', function(e) {
            if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'img') {
                const container = e.target.closest('.image-container');
                if (container) {
                    container.style.display = 'none';
                }
            }
        }, true);
    </script>
</head>
<body>
    <div class="header">
        <h1>Gleon Fallback Demo</h1>
        <p>This fixture proves that missing images (404 Not Found) hide the slider gracefully.</p>
    </div>

    <div class="test-list">
        <!-- Test Case 1: Missing Baseline and Actual Images -->
        <div class="test-case">
            <div class="test-header">
                <div class="test-title">Test Case 1 (Slider Images Missing)</div>
            </div>
            <div class="comparison-grid">
                <div class="image-container" id="slider-container-1">
                    <div class="image-title">Actual vs Baseline Slider</div>
                    <div class="slider-wrapper">
                        <!-- Intentionally broken image links to trigger 404 error event -->
                        <img class="img-baseline" src="non_existent_baseline.png" alt="Baseline">
                        <img class="img-actual" id="actual-img-1" src="non_existent_actual.png" alt="Actual">
                    </div>
                </div>
                <div class="image-container">
                    <div class="image-title">Diff Image (Fallback successful if this is full width)</div>
                    <!-- Using a base64 tiny placeholder or valid image just to show the diff block takes full width -->
                    <div class="img-static" style="display: flex; align-items: center; justify-content: center; font-size: 24px; color: white;">DIFF IMAGE VISIBLE</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
